[tools]
ruby = "3.3.12"

[tasks.setup]
description = "Install development, Rails compatibility, and example dependencies"
run = """
bundle install
bundle exec appraisal generate
bundle exec appraisal install
BUNDLE_GEMFILE=examples/rails/Gemfile bundle install
"""

[tasks.test]
description = "Run the Rails-independent core and Rack suite"
run = "bundle exec rake test"

[tasks.lint]
description = "Run RuboCop"
run = "bundle exec rake rubocop"

[tasks.check]
description = "Run Rails-independent tests and lint"
depends = ["test", "lint"]

[tasks."rails:compatibility"]
description = "Test Rails 7.0, 7.1, 7.2, and 8.x (Rails 8 requires Ruby 3.2+)"
run = """
bundle exec appraisal rails-7.0 rake test
bundle exec appraisal rails-7.1 rake test
bundle exec appraisal rails-7.2 rake test
bundle exec appraisal rails-8 rake test
"""

[tasks."rails:test"]
description = "Smoke-test the Ruby-only Rails example with and without Coupling serving"
run = """
BUNDLE_GEMFILE=examples/rails/Gemfile RAILS_ENV=development bundle exec ruby examples/rails/test/smoke_test.rb
BUNDLE_GEMFILE=examples/rails/Gemfile RAILS_ENV=test bundle exec ruby examples/rails/test/smoke_test.rb
"""

[tasks."rails:server"]
description = "Start the Rails example at http://127.0.0.1:3000"
dir = "examples/rails"
run = "bundle exec rails server --binding 127.0.0.1 --port ${PORT:-3000}"

[tasks.verify]
description = "Run all tests, lint, Rails compatibility checks, and the Rails example smoke test"
depends = ["check", "rails:compatibility", "rails:test"]

[tasks.console]
description = "Start an interactive Coupling console"
run = "bundle exec bin/console"

[tasks.build]
description = "Build the gem"
run = "bundle exec rake build"

[tasks."release:package"]
description = "Build and audit the release gem"
run = """
rm -f pkg/coupling-*.gem
bundle exec rake build
bundle exec ruby script/audit_package.rb pkg/coupling-0.1.0.gem
"""

[tasks."release:installed"]
description = "Smoke-test the installed release gem with core, Rack, and Rails"
depends = ["release:package"]
run = """
gem_home="$(mktemp -d)"
trap 'rm -rf "$gem_home"' EXIT
ruby_gem_path="$(ruby -e 'puts Gem.path.join(":")')"
gem install --install-dir "$gem_home" --no-document pkg/coupling-0.1.0.gem
env -u BUNDLE_GEMFILE -u RUBYOPT -u RUBYLIB \
  GEM_HOME="$gem_home" GEM_PATH="$gem_home:$ruby_gem_path" \
  EXPECTED_COUPLING_GEM_HOME="$gem_home" ruby script/installed_smoke.rb
env -u BUNDLE_GEMFILE -u RUBYOPT -u RUBYLIB \
  GEM_HOME="$gem_home" GEM_PATH="$gem_home:$ruby_gem_path" \
  EXPECTED_COUPLING_GEM_HOME="$gem_home" ruby script/installed_rails_smoke.rb
"""

[tasks."release:check"]
description = "Run the complete local release candidate gate"
depends = ["verify", "release:installed"]
