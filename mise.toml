[tools]
ruby = "3.3.12"
node = "22.22.0"
pnpm = "10.29.3"

[tasks.setup]
description = "Install Ruby, Rails compatibility, example, and frozen pnpm dependencies"
run = """
bundle install
bundle exec appraisal generate
bundle exec appraisal install
BUNDLE_GEMFILE=examples/rails/Gemfile bundle install
pnpm install --frozen-lockfile
"""

[tasks.test]
description = "Run the Rails-independent core and Rack suite"
run = "bundle exec rake test"

[tasks.lint]
description = "Run RuboCop"
run = "bundle exec rake rubocop"

[tasks.check]
description = "Run Rails-independent tests and lint"
depends = ["test", "lint"]

[tasks."rails:compatibility"]
description = "Test Rails 7.0, 7.1, 7.2, and 8.x (Rails 8 requires Ruby 3.2+)"
run = """
bundle exec appraisal rails-7.0 rake test
bundle exec appraisal rails-7.1 rake test
bundle exec appraisal rails-7.2 rake test
bundle exec appraisal rails-8 rake test
"""

[tasks."rails:test"]
description = "Smoke-test the Ruby-only Rails example with and without Coupling serving"
run = """
BUNDLE_GEMFILE=examples/rails/Gemfile RAILS_ENV=development bundle exec ruby examples/rails/test/smoke_test.rb
BUNDLE_GEMFILE=examples/rails/Gemfile RAILS_ENV=test bundle exec ruby examples/rails/test/smoke_test.rb
"""

[tasks."rails:server"]
description = "Start the Rails example at http://127.0.0.1:3000"
dir = "examples/rails"
run = "bundle exec rails server --binding 127.0.0.1 --port ${PORT:-3000}"

[tasks."package:build"]
description = "Build the coupling-vite package"
run = "pnpm --filter coupling-vite build"

[tasks."package:typecheck"]
description = "Typecheck coupling-vite source, tests, and public declarations"
run = "pnpm --filter coupling-vite typecheck"

[tasks."package:test"]
description = "Run coupling-vite unit and current-Vite integration tests"
run = "pnpm --filter coupling-vite test:unit"

[tasks."package:compatibility"]
description = "Run coupling-vite behavior tests with Vite 5, 6, and 7"
run = "pnpm --filter coupling-vite test:compatibility"

[tasks."package:check"]
description = "Build, typecheck, lint, and test coupling-vite across supported Vite versions"
run = "pnpm check"

[tasks."package:audit"]
description = "Audit and smoke-test the packed coupling-vite package"
run = "pnpm --filter coupling-vite run audit"

[tasks.verify]
description = "Run package, Ruby, Rails compatibility, and Rails example checks"
depends = ["package:check", "check", "rails:compatibility", "rails:test"]

[tasks.console]
description = "Start an interactive Coupling console"
run = "bundle exec bin/console"

[tasks.build]
description = "Build the gem"
run = "bundle exec rake build"
